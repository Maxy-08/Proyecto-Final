# Nombre e Identificación
spring.application.name=ms-concesionaria
server.port=8083

# Conexión al servidor Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Desactivar almacenamiento de sesiones en Redis
spring.session.store-type=none
spring.session.redis.configure-action=none

# Excluir la autoconfiguración de Redis
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Seguridad JWT
jwt.secret=your_secret_key
jwt.expiration=86400000

# Integración y rutas a otros microservicios
pathBaseUsuario=http://localhost:8081
pathBaseVehiculo=http://localhost:8082
paginadoVehiculo=/vehiculos/listar/paginado

# Swagger y Autoconfiguración
spring.main.allow-bean-definition-overriding=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packagesToScan=com.example.demo.controller