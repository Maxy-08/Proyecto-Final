# Nombre de la aplicación en Eureka
spring.application.name=ms-vehiculo

# Puerto único para este microservicio
server.port=8082

# Configuración del Cliente Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Conexión a la base de datos 'vehiculos'
spring.datasource.url=jdbc:mysql://localhost:3306/vehiculos?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración de Redis
spring.redis.host=localhost
spring.redis.port=6379
spring.session.store-type=redis
spring.session.redis.flush-mode=immediate 
spring.session.redis.namespace=spring:session

# JWT Security
jwt.secret=your_secret_key
jwt.expiration=86400000

# Rutas e Integraciones entre microservicios
pathBaseUsuario=http://localhost:8083
pathBaseVehiculo=http://localhost:8081
paginadoVehiculo=/vehiculos/listar/paginado

# Buenas prácticas y Swagger
spring.main.allow-bean-definition-overriding=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packagesToScan=com.example.demo.controller