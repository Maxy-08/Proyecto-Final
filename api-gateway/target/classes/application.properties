server.port=8080
spring.application.name=api-gateway

# Redirección automática de rutas según el nombre registrado en Eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Conexión con Eureka Server
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Configuración para Swagger Centralizado desde el Gateway
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=MS-USUARIO
springdoc.swagger-ui.urls[0].url=/ms-usuario/v3/api-docs
springdoc.swagger-ui.urls[1].name=MS-VEHICULO
springdoc.swagger-ui.urls[1].url=/ms-vehiculo/v3/api-docs
springdoc.swagger-ui.urls[2].name=BFF-CONCESIONARIA
springdoc.swagger-ui.urls[2].url=/bffConcesionaria/v3/api-docs